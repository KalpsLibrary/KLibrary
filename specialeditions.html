<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KLibrary — Special Editions</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="genre-page special-editions">

  <header class="site-header">

    <div>
      <span class="eyebrow">KLIBRARY • SHELF</span>
      <h1>Special Editions</h1>
    </div>

    <div class="header-actions">

      <a class="back" href="genres.html">
        ← All genres
      </a>

      <a class="back" href="cart.html">
        Cart <span class="cart-count">0</span>
      </a>

    </div>

  </header>


  <main class="shelf-main">

    <div class="shelf-heading">

      <div class="shelf-mark">✧</div>

      <div>

        <h2>Special Editions</h2>

        <p>
          Beautiful editions, collector's copies and books with something extra.
        </p>

      </div>

    </div>


    <!-- This number will now update automatically -->

    <div class="book-count" id="bookCount">
      LOADING TITLES...
    </div>


    <!-- Books from Supabase will appear here -->

    <section class="book-grid" id="bookGrid">

    </section>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="auth.js"></script>

  <script src="cart.js"></script>


  <script>

    /* =========================
       LOAD SPECIAL EDITIONS
    ========================= */

    async function loadSpecialEditions() {

      const bookGrid =
        document.getElementById("bookGrid");

      const bookCount =
        document.getElementById("bookCount");


      const {
        data: books,
        error
      } = await db
        .from("library_books")
        .select(`
          id,
          title,
          author,
          price,
          description,
          cover_url,
          available
        `)
        .eq("genre", "Special Editions")
        .eq("available", true)
        .order("title");


      if (error) {

        console.error(error);

        bookCount.textContent =
          "UNABLE TO LOAD TITLES";

        bookGrid.innerHTML = `
          <div class="empty-shelf">

            <h2>Something went wrong</h2>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

        return;

      }


      /* =========================
         NO BOOKS
      ========================= */

      if (!books || books.length === 0) {

        bookCount.textContent =
          "NO TITLES ON THIS SHELF";

        bookGrid.innerHTML = `
          <div class="empty-shelf">

            <h2>The shelf is empty</h2>

            <p>
              No Special Editions are currently available.
            </p>

          </div>
        `;

        return;

      }


      /* =========================
         UPDATE COUNT
      ========================= */

      bookCount.textContent =
        `${books.length} TITLES ON THIS SHELF`;


      /* =========================
         CREATE BOOK CARDS
      ========================= */

      bookGrid.innerHTML = "";


      books.forEach(book => {

        const card =
          document.createElement("article");

        card.className = "book-card";


        card.innerHTML = `

          <div class="book-spine">
            ✧
          </div>


          <a href="book.html?book=${encodeURIComponent(book.title)}">

            <img
              class="book-cover"
              src="${escapeHtml(book.cover_url || "")}"
              alt="${escapeHtml(book.title)}"
            >

          </a>


          <div class="book-info">

            <a href="book.html?book=${encodeURIComponent(book.title)}">

              <h3>
                ${escapeHtml(book.title)}
              </h3>

            </a>


            <p>
              by ${escapeHtml(book.author || "Unknown author")}
            </p>


            <div class="book-price">
              ₹${Number(book.price).toFixed(0)} / month
            </div>


            ${
              book.description
                ? `
                  <div class="special-features">

                    <strong>About this edition:</strong>

                    <p>
                      ${escapeHtml(book.description)}
                    </p>

                  </div>
                `
                : ""
            }


            <button
              class="add-to-cart"
              type="button"
              aria-label="Add this book to cart"
            >
              ＋
            </button>

          </div>

        `;


        bookGrid.appendChild(card);

      });


      /* =========================
         CONNECT CART BUTTONS
      ========================= */

      document
        .querySelectorAll(".add-to-cart")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => addBook(button)
          );

        });


      /* Update buttons based on cart */

      await updateCartButtons();

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      return String(value).replace(
        /[&<>'"]/g,

        character => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"

        })[character]

      );

    }


    /* =========================
       START
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const {
          data: {
            session
          }
        } = await db.auth.getSession();


        if (!session) {

          window.location.href =
            "index.html";

          return;

        }


        await loadSpecialEditions();

        await refreshCartCount();

      }
    );

  </script>

</body>
</html>
