<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KLibrary — Admin</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>

<body class="admin-page">

  <header class="site-header">
    <div>
      <span class="eyebrow">KLIBRARY • ADMIN</span>
      <h1>Library Management</h1>
    </div>

    <div class="header-actions">
      <a class="back" href="genres.html">← Library</a>
    </div>
  </header>

  <main class="admin-main" id="adminContent" style="display: none;">

    <section class="admin-card">

      <div class="shelf-mark">✦</div>

      <h2>Add a New Book</h2>

      <p class="admin-intro">
        Add a book directly to the KLibrary catalogue.
      </p>

      <form id="bookForm">

        <label for="title">Book Title</label>
        <input
          type="text"
          id="title"
          required
          placeholder="e.g. The Silent Patient"
        >

        <label for="author">Author</label>
        <input
          type="text"
          id="author"
          required
          placeholder="e.g. Alex Michaelides"
        >

        <label for="price">Price per month</label>
        <input
          type="number"
          id="price"
          min="0"
          required
          placeholder="50"
        >

        <!-- MULTIPLE GENRES -->

        <label>Select Genres</label>

        <div id="genreOptions" style="
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
          margin: 12px 0 20px;
        ">

          <label>
            <input type="checkbox" name="genre" value="Romantasy">
            Romantasy
          </label>

          <label>
            <input type="checkbox" name="genre" value="Thrillers & Mystery">
            Thrillers & Mystery
          </label>

          <label>
            <input type="checkbox" name="genre" value="Self-help">
            Self-help
          </label>

          <label>
            <input type="checkbox" name="genre" value="Others">
            Others
          </label>

          <label>
            <input type="checkbox" name="genre" value="Special Editions">
            Special Editions
          </label>

          <label>
            <input type="checkbox" name="genre" value="Comics">
            Comics
          </label>

        </div>

        <p style="font-size: 13px; margin-top: -10px;">
          You can select more than one genre.
        </p>

        <!-- WHAT'S SPECIAL -->

        <div id="specialFeaturesSection" style="display: none;">

          <label for="specialFeatures">What's special?</label>

          <textarea
            id="specialFeatures"
            rows="5"
            placeholder="Enter each feature on a new line...&#10;e.g. Hardcover&#10;Illustrated&#10;Glossy paper"
          ></textarea>

        </div>

        <label for="description">Description</label>

        <textarea
          id="description"
          rows="6"
          required
          placeholder="Enter the book description..."
        ></textarea>

        <label for="cover">Book Cover</label>

        <input
          type="file"
          id="cover"
          accept="image/*"
          required
        >

        <button type="submit">
          Add Book
        </button>

        <p id="adminMessage" class="message"></p>

      </form>

    </section>

  </main>

  <script>

    /* =========================
       YOUR ADMIN ACCOUNT
    ========================= */

    const ADMIN_UID =
      "55df0ebb-50a3-4cd3-a674-6253c097f0c4";


    /* =========================
       CHECK ADMIN ACCOUNT
    ========================= */

    async function checkAdmin() {

      const {
        data: { user },
        error
      } = await db.auth.getUser();

      if (error) {
        console.error(error);
      }

      if (!user || user.id !== ADMIN_UID) {

        document.body.innerHTML = `
          <main style="
            min-height:100vh;
            display:grid;
            place-items:center;
            text-align:center;
            padding:30px;
          ">
            <div>
              <h1>Access Denied</h1>

              <p>
                You do not have permission
                to access the KLibrary admin page.
              </p>

              <a href="genres.html">
                Return to KLibrary
              </a>
            </div>
          </main>
        `;

        return false;
      }

      document.getElementById("adminContent").style.display =
        "block";

      return true;
    }


    /* =========================
       GENRE SELECTION
    ========================= */

    const genreCheckboxes =
      document.querySelectorAll('input[name="genre"]');

    const specialFeaturesSection =
      document.getElementById("specialFeaturesSection");

    const specialFeaturesInput =
      document.getElementById("specialFeatures");


    function updateSpecialFeaturesVisibility() {

      const specialEditionSelected =
        Array.from(genreCheckboxes).some(checkbox =>
          checkbox.checked &&
          checkbox.value === "Special Editions"
        );

      specialFeaturesSection.style.display =
        specialEditionSelected ? "block" : "none";

      specialFeaturesInput.required =
        specialEditionSelected;

      if (!specialEditionSelected) {
        specialFeaturesInput.value = "";
      }
    }


    genreCheckboxes.forEach(checkbox => {
      checkbox.addEventListener(
        "change",
        updateSpecialFeaturesVisibility
      );
    });


    /* =========================
       ADD BOOK
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const allowed = await checkAdmin();

        if (!allowed) return;

        const form =
          document.getElementById("bookForm");

        const message =
          document.getElementById("adminMessage");


        form.addEventListener(
          "submit",
          async (event) => {

            event.preventDefault();

            message.textContent = "Adding book...";
            message.className = "message";


            const title =
              document.getElementById("title")
                .value.trim();

            const author =
              document.getElementById("author")
                .value.trim();

            const price =
              Number(
                document.getElementById("price").value
              );

            const selectedGenres =
              Array.from(genreCheckboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);

            const genre =
              selectedGenres.join(", ");

            const description =
              document.getElementById("description")
                .value.trim();

            const specialEditionSelected =
              selectedGenres.includes("Special Editions");

            const specialFeatures =
              specialFeaturesInput.value
                .split(/\r?\n/)
                .map(feature => feature.trim())
                .filter(Boolean)
                .join("\n");

            const coverFile =
              document.getElementById("cover")
                .files[0];


            if (selectedGenres.length === 0) {

              message.textContent =
                "Please select at least one genre.";

              message.className = "message error";

              return;
            }


            if (specialEditionSelected && !specialFeatures) {

              message.textContent =
                "Please enter what's special about this edition.";

              message.className = "message error";

              return;
            }


            if (!coverFile) {

              message.textContent =
                "Please choose a cover image.";

              message.className = "message error";

              return;
            }


            try {

              /* UPLOAD COVER */

              const fileName =
                `${Date.now()}-${coverFile.name.replace(
                  /[^a-zA-Z0-9._-]/g,
                  ""
                )}`;

              const {
                error: uploadError
              } = await db.storage
                .from("book-covers")
                .upload(fileName, coverFile);

              if (uploadError) {
                throw uploadError;
              }


              /* GET COVER URL */

              const {
                data: { publicUrl }
              } = db.storage
                .from("book-covers")
                .getPublicUrl(fileName);


              /* ADD BOOK TO DATABASE */

              const {
                error: bookError
              } = await db
                .from("library_books")
                .insert({

                  title: title,
                  author: author,
                  price: price,
                  genre: genre,
                  description: description,
                  cover_url: publicUrl,
                  available: true,

                  special_features:
                    specialEditionSelected
                      ? specialFeatures
                      : null

                });

              if (bookError) {
                throw bookError;
              }


              /* SUCCESS */

              message.textContent =
                "Book added successfully!";

              message.className = "message success";

              form.reset();

              updateSpecialFeaturesVisibility();

            } catch (error) {

              console.error(error);

              message.textContent =
                error.message || "Something went wrong.";

              message.className = "message error";

            }

          }
        );

      }
    );

  </script>

</body>
</html>
