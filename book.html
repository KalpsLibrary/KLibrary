   const params = new URLSearchParams(window.location.search);
const bookKey = params.get("book");

const book = Object.values(books).find(
  item => item.title.toLowerCase().replace(/[^a-z0-9]/g, "") === bookKey
);

    if (book) {

      document.title = `KLibrary — ${book.title}`;

      document.getElementById("book-title").textContent = book.title;
      document.getElementById("book-name").textContent = book.title;

      document.getElementById("book-author").textContent =
        `by ${book.author}`;

      document.getElementById("book-price").textContent =
        book.price;

      document.getElementById("book-description").textContent =
        book.description;

      const cover = document.getElementById("book-cover");

      cover.src = book.cover;
      cover.alt = `${book.title} by ${book.author}`;

      document.getElementById("add-book-to-cart").dataset.title =
        book.title;

    } else {

      document.getElementById("book-title").textContent = "Book Not Found";
      document.getElementById("book-name").textContent = "Book Not Found";
      document.getElementById("book-description").textContent =
        "Sorry, this book could not be found.";

      document.getElementById("book-cover").style.display = "none";
      document.getElementById("add-book-to-cart").style.display = "none";

    }
const addBookButton = document.getElementById("add-book-to-cart");

if (addBookButton && book) {
  addBookButton.addEventListener("click", async () => {
    addBookButton.disabled = true;

    const { error } = await db.rpc("add_to_cart", {
      p_book_title: book.title,
      p_price: Number(book.price.replace(/[^\d.]/g, ""))
    });

    addBookButton.disabled = false;

    if (error) {
      alert(error.message);
      return;
    }

    addBookButton.textContent = "✓ Added to Cart";

    await refreshCartCount();
  });
}
